name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build macOS app bundle
        run: npx electron-builder --mac --publish=never
      - name: Package app into zip
        run: |
          cd dist-electron
          # electron-builder --mac dir outputs to mac-arm64/ directory
          app_dir=$(ls -d mac-arm64 2>/dev/null || ls -d */ 2>/dev/null | head -1)
          if [ -n "$app_dir" ]; then
            echo "Packaging $app_dir"
            zip -ry "Todo-App-mac.zip" "$app_dir"
          else
            echo "ERROR: No mac build output found"
            ls -la
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist-electron/Todo-App-mac.zip

  build-win:
    name: Build Windows
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build Windows portable exe
        run: npx electron-builder --win portable --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: dist-electron/*.exe

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - name: Set up Android project
        run: |
          if [ ! -d "android" ]; then
            CI=true npx cap add android 2>&1 || npx cap add android
            # Fix Kotlin duplicate class conflict (GNU sed on ubuntu)
            sed -i 's/configurations.all {/configurations {\n    all {\n        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"\n        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"\n    }\n}\n\nconfigurations.all {/' android/app/build.gradle
          fi
          npx cap sync android
        env:
          CI: true
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android/app/build/outputs/apk/debug/*.apk

  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-web, build-mac, build-win, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Prepare release files
        run: |
          mkdir -p release
          cp web-dist/* release/ 2>/dev/null || true
          cp mac-build/* release/ 2>/dev/null || true
          cp win-build/* release/ 2>/dev/null || true
          cp android-build/* release/ 2>/dev/null || true
          ls -lh release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

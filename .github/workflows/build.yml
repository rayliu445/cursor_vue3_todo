name: Build & Release

on:
  push:
    branches: [ main ]     # 推送到 main 时构建
    tags:
      - 'v*'               # 推送 tag 时发布 Release
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --publish=never
      - name: Package macOS app
        run: |
          cd dist-electron
          dmg_file=$(ls *.dmg 2>/dev/null || true)
          if [ -n "$dmg_file" ]; then
            echo "DMG found: $dmg_file"
            mkdir -p ../release/v0.0.1
            cp "$dmg_file" ../release/v0.0.1/
          else
            echo "No DMG, using dir"
            dir_name=$(ls -d *-unpacked 2>/dev/null || ls -d mac* 2>/dev/null || echo "")
            if [ -n "$dir_name" ]; then
              zip -r "../release/Todo-App-mac.zip" "$dir_name"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip

  build-win:
    name: Build Windows
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: dist-electron/*.exe

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - name: Initialize Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-web, build-mac, build-win, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Organize release files
        run: |
          mkdir -p release
          cp web-dist/* release/ 2>/dev/null || true
          cp mac-dmg/* release/ 2>/dev/null || true
          cp win-exe/* release/ 2>/dev/null || true
          cp android-apk/* release/ 2>/dev/null || true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

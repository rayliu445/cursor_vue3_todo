<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景：自带 squircle 圆角的圆角方形。
       注意：不依赖 macOS 系统自动套圆角（部分系统/图标缓存不生效时会是方形），
       所以这里直接在 PNG 里画好圆角，保证任何环境下显示都是圆润的。
       圆角 rx≈25%（260px），四周留少量透明边距避免双重圆角突兀。 -->
  <rect x="20" y="20" width="984" height="984" rx="260" fill="#FFFFFF"/>
  <rect x="20" y="20" width="984" height="984" rx="260" fill="none" stroke="#EDE8E0" stroke-width="8"/>

  <!-- 像素柴犬：放大更饱满（32 网格 × 18 = 576px，起点 224,224） -->
  <g transform="translate(224 224) scale(18)" shape-rendering="crispEdges">
    <!-- 左耳（棕） -->
    <rect x="5" y="3" width="5" height="4" fill="#c8792f"/>
    <rect x="4" y="7" width="7" height="2" fill="#c8792f"/>
    <rect x="6" y="5" width="2" height="3" fill="#9c5a22"/>
    <!-- 右耳（棕） -->
    <rect x="22" y="3" width="5" height="4" fill="#c8792f"/>
    <rect x="21" y="7" width="7" height="2" fill="#c8792f"/>
    <rect x="24" y="5" width="2" height="3" fill="#9c5a22"/>
    <!-- 头顶（棕） -->
    <rect x="9" y="7" width="14" height="2" fill="#c8792f"/>
    <!-- 脸颊（棕） -->
    <rect x="8" y="8" width="16" height="1" fill="#c8792f"/>
    <rect x="7" y="9" width="18" height="8" fill="#c8792f"/>
    <!-- 白色眉毛点（暖米色） -->
    <rect x="10" y="9" width="2" height="1" fill="#f3e6d3"/>
    <rect x="20" y="9" width="2" height="1" fill="#f3e6d3"/>
    <!-- 眼睛（黑） -->
    <rect x="10" y="11" width="4" height="4" fill="#3b2a1a"/>
    <rect x="18" y="11" width="4" height="4" fill="#3b2a1a"/>
    <rect x="11" y="11" width="2" height="2" fill="#fff"/>
    <rect x="19" y="11" width="2" height="2" fill="#fff"/>
    <!-- 白色下巴/嘴部（暖米色） -->
    <rect x="11" y="13" width="10" height="1" fill="#f3e6d3"/>
    <rect x="10" y="14" width="12" height="2" fill="#f3e6d3"/>
    <rect x="9" y="16" width="14" height="3" fill="#f3e6d3"/>
    <rect x="8" y="19" width="16" height="3" fill="#f3e6d3"/>
    <rect x="9" y="22" width="14" height="2" fill="#f3e6d3"/>
    <rect x="11" y="24" width="10" height="1" fill="#f3e6d3"/>
    <!-- 鼻子（黑） -->
    <rect x="13" y="15" width="6" height="3" fill="#3b2a1a"/>
    <!-- 嘴（黑） -->
    <rect x="15" y="18" width="2" height="2" fill="#3b2a1a"/>
    <rect x="12" y="20" width="8" height="1" fill="#3b2a1a"/>
    <!-- 腮红（粉） -->
    <rect x="7" y="14" width="2" height="2" fill="#ffb3a7" opacity="0.85"/>
    <rect x="23" y="14" width="2" height="2" fill="#ffb3a7" opacity="0.85"/>
  </g>

  <!-- 右上角对勾：绿色（完成语义） -->
  <path d="M712 320 l84 84 l168 -196" stroke="#22c55e" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
